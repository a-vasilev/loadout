name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check skills and manifests
        run: node scripts/validate.mjs
      - name: Validate Claude Code plugin
        run: npx -y @anthropic-ai/claude-code plugin validate .
      - name: Check npx skills discovery
        run: npx -y skills add . --list
